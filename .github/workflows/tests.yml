name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test lock
        # --require-hashes: the pinned set is installed or nothing is.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.lock
          pip install --no-deps -e .

      - name: Run the suite
        run: pytest -q --cov=urlshortener --cov-report=term-missing --cov-fail-under=85
