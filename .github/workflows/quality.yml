name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the quality lock
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-quality.lock
          pip install --no-deps -e .

      # These three commands are reproduced verbatim in the
      # documentation; keep them in step.
      - name: ruff
        run: ruff check urlshortener tests docker

      - name: bandit
        run: bandit -ll -r urlshortener docker

      - name: pip-audit
        # ONE documented exception, reviewed 2026-08-22 (audit finding
        # S-08): PYSEC-2026-3447 hits setuptools 81, fixed in 83, but
        # pyramid 2.1 pins setuptools<82 — the bump is impossible
        # without leaving pyramid 2.1. Re-check at every pyramid
        # release; remove this flag the moment the pin is relaxed.
        # Any OTHER advisory fails the job.
        run: pip-audit --require-hashes -r requirements.lock --ignore-vuln PYSEC-2026-3447
