# Packaging metadata.
#
# The 2016 project had a flat `requirements.txt` with unbounded, long
# dead pins (Flask 0.10.1, Flask-Cors 2.1.2) and no lock: two installs
# at different dates produced different environments, and the version
# on PyPI no longer resolves at all under Python 3.12.
#
# Bounds below are measured against the tested environment. The exact
# pinned sets live in three hashed locks (same layout as AlirPunkto):
#   requirements.lock          runtime only        — what the image installs
#   requirements-test.lock     runtime + testing   — what tests.yml installs
#   requirements-quality.lock  runtime + quality   — what quality.yml installs
#
# Regenerate with pip-tools (seeding with the previous lock keeps the
# pinned versions stable):
#   pip install pip-tools
#   pip-compile --allow-unsafe --generate-hashes --strip-extras \
#       -o requirements.lock pyproject.toml
#   pip-compile --allow-unsafe --generate-hashes --strip-extras \
#       --extra testing -o requirements-test.lock pyproject.toml
#   pip-compile --allow-unsafe --generate-hashes --strip-extras \
#       --extra quality -o requirements-quality.lock pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlshortener"
version = "2.0.10"
description = "URL shortener (Pyramid/SQLAlchemy) — successor of ecreall/urlshortener"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
keywords = ["web", "pyramid", "url", "shortener"]
classifiers = [
    "Programming Language :: Python",
    "Framework :: Pyramid",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "plaster_pastedeploy>=1.0.1,<2",
    "pyramid>=2.1,<3",
    "pyramid_chameleon>=0.3,<0.4",
    "pyramid_tm>=2.6,<3",
    "pyramid_retry>=2.1.1,<3",
    "waitress>=3.0.2,<4",
    "SQLAlchemy>=2.0.36,<3",
    "zope.sqlalchemy>=3.1,<4",
    "transaction>=5.1,<6",
    "python-dotenv>=1.0.1,<2",
    # NOTE (audit 2026-08-22, S-08): setuptools is a RUNTIME dependency
    # here -- pyramid, zope-deprecation and zope-sqlalchemy declare it
    # through pkg_resources -- so it ships in the image and pip-audit
    # sees it. PYSEC-2026-3447 affects the resolved 81.0.0 and is fixed
    # in 83.0.0, but pyramid 2.1 pins `setuptools<82`: the bump is
    # IMPOSSIBLE without leaving pyramid 2.1. The advisory is therefore
    # carried as a documented exception in .github/workflows/quality.yml
    # and must be revisited at every pyramid release.
]

[project.optional-dependencies]
testing = [
    "WebTest>=3.0.7,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=5.0,<8",
]
quality = [
    "ruff>=0.9,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]
i18n = [
    # Only needed to EXTRACT and COMPILE catalogues, never at runtime:
    # the .mo files are versioned, the running app just reads them.
    "Babel>=2.16,<3",
    "lingua>=4.15,<5",
]

[project.entry-points."paste.app_factory"]
main = "urlshortener:main"

[project.scripts]
urlshortener-upgrade = "urlshortener.upgrades:main"
urlshortener-import-legacy = "urlshortener.tools.import_legacy:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes as a blocking gate (real defects: unused/duplicated imports,
# undefined names), plus the pycodestyle errors that are never stylistic.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
