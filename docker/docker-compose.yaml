# =============================================================================
# docker/docker-compose.yaml — urlshortener
#
# Run ALL commands from the REPOSITORY ROOT:
#
#   docker compose --env-file docker/.env -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml logs -f
#   docker compose -f docker/docker-compose.yaml down
#
# Run ./docker/init.sh once before the first `up`.
#
# Path resolution note: compose resolves `context:` and bind-mount paths
# relative to THIS FILE (docker/), so `..` is the repository root.
# =============================================================================

services:

  urlshortener:
    build:
      # The build needs the whole source tree, so the context is the
      # repository root and the Dockerfile path is spelled out.
      context: ..
      dockerfile: docker/DockerfileUrlshortener
      args:
        BUILD_WITH_DEBUG: ${BUILD_WITH_DEBUG:-0}
        UBUNTU_SNAPSHOT: ${URLSHORTENER_UBUNTU_SNAPSHOT:-}
    image: urlshortener
    container_name: urlshortener
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      # The public prefix of the short links, trailing slash included.
      URLSHORTENER_BASE_URL: ${URLSHORTENER_BASE_URL:-http://localhost:5123/}
      SQLALCHEMY_URL: ${SQLALCHEMY_URL:-sqlite:////home/urlshortener/app/var/urlshortener.sqlite}
      URLSHORTENER_CODE_LENGTH: ${URLSHORTENER_CODE_LENGTH:-7}
      URLSHORTENER_BLOCK_PRIVATE_TARGETS: ${URLSHORTENER_BLOCK_PRIVATE_TARGETS:-true}
      URLSHORTENER_BLOCKED_HOSTS: ${URLSHORTENER_BLOCKED_HOSTS:-}
      URLSHORTENER_THROTTLE_MAX: ${URLSHORTENER_THROTTLE_MAX:-30}
      URLSHORTENER_THROTTLE_WINDOW: ${URLSHORTENER_THROTTLE_WINDOW:-300}
      URLSHORTENER_CORS_ORIGINS: ${URLSHORTENER_CORS_ORIGINS:-}

      # WITHOUT THIS LINE THE STACK SERVES NOTHING (external audit,
      # C-07). `production.ini` says `listen = localhost:5123`, which is
      # right on bare metal and wrong in a container: waitress then
      # binds the loopback of the container's own network namespace,
      # while Docker forwards the published port to the container's
      # interface. Every connection was refused. The variable existed in
      # .env.example and in the entrypoint; it was simply never passed
      # in, so nothing carried it across.
      URLSHORTENER_LISTEN: ${URLSHORTENER_LISTEN:-0.0.0.0:5123}

      # Left empty on purpose: the entrypoint then substitutes the
      # container's own default gateway, which is the address nginx
      # arrives from. Set it to trust a different proxy, or to the
      # literal `none` to trust no proxy at all.
      URLSHORTENER_TRUSTED_PROXY: ${URLSHORTENER_TRUSTED_PROXY:-}
      URLSHORTENER_TRUSTED_PROXY_COUNT: ${URLSHORTENER_TRUSTED_PROXY_COUNT:-1}

      # Caps the request body in waitress AND in the application, from
      # one value. Waitress's own default is 1 GiB, in a container
      # capped at 512 MB.
      URLSHORTENER_MAX_BODY_BYTES: ${URLSHORTENER_MAX_BODY_BYTES:-16384}

    # Published on the loopback interface only: the reverse proxy in
    # front (nginx, Apache) is what faces the network. Binding
    # 0.0.0.0:5123 would expose the service directly, which is exactly
    # what the legacy deployment avoided.
    ports:
      - "127.0.0.1:5123:5123"

    volumes:
      # The SQLite file. This is the whole state of the service.
      - urlshortener-var:/home/urlshortener/app/var

    security_opt:
      - no-new-privileges:true

    # Audit 2026-08-22, S-06. Waitress binds a high port as a non-root
    # user and needs no Linux capability whatsoever, so drop them all.
    cap_drop:
      - ALL

    # `read_only: true` (plus a tmpfs for /tmp) is the next step and is
    # NOT enabled here: it has not been exercised against a real build
    # in this environment, and shipping an untested hardening flag that
    # breaks the first start is worse than not shipping it. Validate it
    # in the smoke workflow, then turn it on.

volumes:
  urlshortener-var:
