###
# urlshortener — production configuration
#
#   pserve production.ini
#
# Every `urlshortener.*` key below can be overridden by the matching
# environment variable (URLSHORTENER_BASE_URL and friends), so a
# container is reconfigured without editing this file.
###

[app:main]
use = egg:urlshortener

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# SQLite by default: a shortener is a tiny key/value store with a very
# high read:write ratio, and one file is far easier to back up than a
# server. Point this at PostgreSQL the day one file is not enough:
#   sqlalchemy.url = postgresql+psycopg://user:pass@host/urlshortener
sqlalchemy.url = sqlite:///%(here)s/var/urlshortener.sqlite
sqlalchemy.pool_pre_ping = true

# PUBLIC prefix of the short links, WITH its trailing slash. Behind
# nginx's `location /urlmetadata/` (KuneAgi's existing mount point)
# this is the full public URL including that prefix.
urlshortener.base_url = https://example.org/
urlshortener.code_length = 7
urlshortener.max_url_length = 2048
urlshortener.default_scheme = http
urlshortener.allowed_schemes = http https
urlshortener.block_private_targets = true
urlshortener.blocked_hosts =
urlshortener.count_hits = true
urlshortener.throttle_max_creations = 30
urlshortener.throttle_window_seconds = 300
# Reads of the JSON API per address and window; 0 = unlimited. Raise it
# if the LEGACY short codes matter to you: they are 1 to 3 characters
# and sequential, so the whole 2016 corpus is walkable (audit S-02).
urlshortener.throttle_max_reads = 0
# Empty means "no cross-origin call". Put '*' back only if the JSON API
# really is for everyone.
urlshortener.cors_origins =

[server:main]
use = egg:waitress#main
listen = localhost:5123
# Set when a reverse proxy terminates TLS in front of this process, so
# `request.client_addr` is the visitor and not the proxy.
trusted_proxy = 127.0.0.1
trusted_proxy_headers = x-forwarded-for x-forwarded-proto x-forwarded-port
clear_untrusted_proxy_headers = true
# EXPLICIT on purpose (audit 2026-08-22, S-05). Waitress reads the
# client address at this position from the RIGHT of X-Forwarded-For.
# With one proxy the default of 1 is correct. Put a CDN in front
# without raising this to 2 and the address read becomes the one the
# CDN appended for the CDN — worse, a visitor-supplied X-Forwarded-For
# then lands in that position, and the rate-limiting key becomes
# attacker-controlled. One number, two proxies, silent failure.
trusted_proxy_count = 1

###
# Logging
###

[loggers]
keys = root, urlshortener, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_urlshortener]
level = INFO
handlers =
qualname = urlshortener

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s] %(message)s
