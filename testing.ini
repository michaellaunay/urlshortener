###
# urlshortener — configuration used by the test suite.
#
# In-memory database, deterministic base URL, throttling and the
# private-target guard both OFF so a test can shorten http://127.0.0.1
# without fighting the security rules it is not testing. The tests that
# DO test those rules build their own settings.
###

[app:main]
use = egg:urlshortener

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.default_locale_name = en

sqlalchemy.url = sqlite://

urlshortener.base_url = http://short.test/
urlshortener.code_length = 9
urlshortener.block_private_targets = false
urlshortener.throttle_max_creations = 0
urlshortener.cors_origins =

[server:main]
use = egg:waitress#main
listen = localhost:5123

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
